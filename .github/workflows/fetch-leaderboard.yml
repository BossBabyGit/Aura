name: Fetch Leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:      # allow manual run

permissions:
  contents: write         # needed to push the updated file

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch leaderboard
        env:
          RAINBET_API_KEY: ${{ secrets.RAINBET_API_KEY }}
        run: |
          python scripts/fetch_leaderboard.py

      - name: Commit changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/leaderboard.json
            git commit -m "chore(leaderboard): update data [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
